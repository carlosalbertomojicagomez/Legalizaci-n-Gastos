<!doctype html>
<html lang="es" class="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Legalización de gastos</title>
    <meta name="description" content="PWA mobile-first para legalización de gastos operacionales en Colombia con captura de factura electrónica DIAN, extracción por IA, validación de CUFE y reportes en Excel." />
    
    <!-- Open Graph & Social Cards -->
    <meta property="og:title" content="Legalización de gastos" />
    <meta property="og:description" content="PWA mobile-first para legalización de gastos operacionales en Colombia con captura de factura electrónica DIAN, extracción por IA, validación de CUFE y reportes en Excel." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- PWA & Mobile Web Capabilities -->
    <meta name="theme-color" content="#07426B" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Legalización" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <script>
      // En entornos Cloud Run / iframe el HMR por WebSockets está deshabilitado por diseño.
      // Interceptamos y silenciamos avisos espurios de WebSocket cerrado sin abrir.
      (function() {
        var origConsoleError = console.error;
        console.error = function() {
          var msg = arguments[0];
          if (
            (typeof msg === 'string' && (msg.includes('WebSocket closed without opened') || msg.includes('[vite]'))) ||
            (msg instanceof Error && (msg.message.includes('WebSocket closed without opened') || msg.message.includes('[vite]')))
          ) {
            return;
          }
          origConsoleError.apply(console, arguments);
        };

        window.addEventListener('error', function (event) {
          if (
            event?.message?.includes('WebSocket closed without opened') ||
            (typeof event?.message === 'string' && event.message.includes('[vite]')) ||
            event?.error?.message?.includes('WebSocket closed without opened')
          ) {
            event.stopImmediatePropagation();
            event.preventDefault();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function (event) {
          if (
            event?.reason?.message?.includes('WebSocket closed without opened') ||
            (typeof event?.reason?.message === 'string' && event.reason.message.includes('[vite]'))
          ) {
            event.stopImmediatePropagation();
            event.preventDefault();
          }
        }, true);
      })();
    </script>
  </head>
  <body class="bg-slate-50 dark:bg-slate-900 text-slate-900 dark:text-slate-100 antialiased min-h-screen selection:bg-blue-600 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
